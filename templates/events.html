{% extends "layout.html" %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-info text-white">
                <h5 class="mb-0"><i class="bi bi-calendar-plus"></i> Add Event</h5>
            </div>
            <div class="card-body">
                <form action="/events" method="post">
                    <div class="mb-3">
                        <label class="form-label">Event Title</label>
                        <input type="text" class="form-control" name="title" placeholder="Ex: Doctor appointment" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" class="form-control" name="date" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Time (optional)</label>
                        <input type="time" class="form-control" name="time">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Who?</label>
                        <select class="form-select" name="member_id" required>
                            <option value="">Select member</option>
                            {% for member in members %}
                            <option value="{{ member.id }}">{{ member.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-info text-white w-100">Add Event</button>
                </form>
            </div>
        </div>
        <div class="mt-3">
            <a href="/dashboard" class="btn btn-secondary">← Back to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
