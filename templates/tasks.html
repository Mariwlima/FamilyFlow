{% extends "layout.html" %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h5 class="mb-0"><i class="bi bi-check2-square"></i> Add Task</h5>
            </div>
            <div class="card-body">
                <form action="/tasks" method="post">
                    <div class="mb-3">
                        <label class="form-label">Task</label>
                        <input type="text" class="form-control" name="title" placeholder="Ex: Clean the kitchen" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Who should do it?</label>
                        <select class="form-select" name="member_id" required>
                            <option value="">Select member</option>
                            {% for member in members %}
                            <option value="{{ member.id }}">{{ member.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Due Date (optional)</label>
                        <input type="date" class="form-control" name="due_date">
                    </div>
                    <button type="submit" class="btn btn-warning w-100">Add Task</button>
                </form>
            </div>
        </div>
        <div class="mt-3">
            <a href="/dashboard" class="btn btn-secondary">← Back to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
