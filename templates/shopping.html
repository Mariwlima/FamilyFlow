{% extends "layout.html" %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0"><i class="bi bi-cart"></i> Shopping List</h5>
            </div>
            <div class="card-body">
                <form action="/shopping" method="post">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" name="item" placeholder="Add item..." required>
                        <button type="submit" class="btn btn-success">Add</button>
                    </div>
                </form>
                <ul class="list-group">
                    {% for item in items %}
                    <li class="list-group-item d-flex justify-content-between align-items-center {% if item.done %}text-decoration-line-through text-muted{% endif %}">
                        {{ item.item }}
                        <div>
                            {% if not item.done %}
                            <a href="/shopping/done/{{ item.id }}" class="btn btn-sm btn-success">✓</a>
                            {% endif %}
                            <a href="/shopping/delete/{{ item.id }}" class="btn btn-sm btn-danger">✕</a>
                        </div>
                    </li>
                    {% else %}
                    <li class="list-group-item text-muted">Shopping list is empty!</li>
                    {% endfor %}
                </ul>
            </div>
        </div>
        <div class="mt-3">
            <a href="/dashboard" class="btn btn-secondary">← Back to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
